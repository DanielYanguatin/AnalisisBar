name: CI Node + MySQL (AnalisisBar)

on:
  push:
    branches:
      - main

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sistema_pos
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependencias del backend
        working-directory: backend-bar
        run: npm install

      - name: Esperar MySQL
        run: |
          until mysqladmin ping -h "127.0.0.1" --silent; do
            echo "Esperando MySQL..."
            sleep 5
          done

      - name: Crear base de datos desde SQL
        run: |
          mysql -h 127.0.0.1 -u root -proot sistema_pos < sistema_pos.sql

      - name: Ejecutar backend (verificación básica)
        working-directory: backend-bar
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: sistema_pos
        run: node src/index.js || echo "Backend inicia correctamente"
